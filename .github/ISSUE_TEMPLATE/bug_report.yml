name: Bug report
description: Report something that is not working correctly
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem you encountered.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the steps needed to reproduce the problem.
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: Shihen version
      placeholder: e.g. 2.3.0
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or other information.
    validations:
      required: false
